{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Student Fee Manager{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><style>
:root{--green:#047857;--green-dark:#065f46;--ivory:#f7f8f1;--ink:#1f2933;--muted:#68756f;--line:#dce4dc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 10%,#e2eee5 0,transparent 38%),var(--ivory);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.auth-shell{min-height:100vh;display:grid;place-items:center;padding:28px}.auth-card{width:min(100%,460px);padding:clamp(28px,6vw,44px);border:1px solid var(--line);border-radius:20px;background:#fffefa;box-shadow:0 24px 70px #193b2c18}.auth-brand{display:flex;align-items:center;gap:11px;margin-bottom:30px;color:var(--green-dark);font-weight:750}.auth-brand-name{font-family:"Plus Jakarta Sans",Inter,sans-serif;font-size:1.04rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--green);color:white}.auth-card h1{margin:0 0 8px;font-family:Georgia,serif;font-size:2rem;font-weight:500;letter-spacing:-.04em}.auth-subtitle{margin:0 0 25px;color:var(--muted)}.form-label{font-size:.9rem;font-weight:650}.form-control{min-height:48px;border-color:#d4ddd5;border-radius:10px}.form-control:focus{border-color:var(--green);box-shadow:0 0 0 .22rem #0478571a}.auth-submit{width:100%;min-height:49px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:700;transition:background .18s,transform .18s}.auth-submit:hover{background:var(--green-dark);color:#fff;transform:translateY(-1px)}.auth-links{margin-top:22px;text-align:center;color:var(--muted);font-size:.93rem}.auth-links a,.auth-inline{color:var(--green-dark);font-weight:650;text-decoration:none}.auth-links a:hover,.auth-inline:hover{text-decoration:underline}.alert{border-radius:10px}.helptext{font-size:.82rem;color:var(--muted)}
</style></head><body><main class="auth-shell"><section class="auth-card {% block card_class %}{% endblock %}"><div class="auth-brand"><span class="brand-mark">GT</span><span class="auth-brand-name">GTEC <small class="d-block text-secondary fw-normal" style="font:400 .78rem Inter,sans-serif;letter-spacing:0;text-transform:none">Student Fee Manager</small></span></div>{% block content %}{% endblock %}</section></main></body></html>
